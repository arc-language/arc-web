<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><meta name="description" content="Dashboard"><style>@layer base {
  *, *::before, *::after { box-sizing: border-box }
  :root {
    --arc-font-sans: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    --arc-font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    --arc-font-serif: Lora, Georgia, serif;
    --arc-radius-sm: 4px;
    --arc-radius-md: 8px;
    --arc-radius-lg: 12px;
    --arc-radius-xl: 16px;
    --arc-radius-2xl: 24px;
    --arc-radius-full: 9999px;
    --arc-shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.05);
    --arc-shadow-md: 0 4px 6px oklch(0% 0 0 / 0.07), 0 1px 3px oklch(0% 0 0 / 0.06);
    --arc-shadow-lg: 0 10px 15px oklch(0% 0 0 / 0.08), 0 4px 6px oklch(0% 0 0 / 0.05);

  .arc-col { display: flex; flex-direction: column }
  .arc-center { display: flex; align-items: center; justify-content: center }
  .arc-spacer { flex: 1 0 auto }
  .arc-wrap { display: flex; flex-wrap: wrap }
}</style></head><body><header><h2>Dashboard</h2></header><main><div class="arc-card_lsp0"><h2>Stats</h2><p>This card&#039;s data comes from @server functions via ADP.</p></div><div class="arc-card_lsp0"><h2>Counter: <span id="_a1"></span></h2><div class="arc-row_lsp0"><button id="_a2">−</button><button id="_a3">+</button></div></div></main><footer><p>Arc — built with @server edge functions.</p></footer><script src="app.js" defer></script></body></html>
