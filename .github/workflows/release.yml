name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # sign npm provenance via OIDC

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Sanity: tag version must match package.json version
      - name: Verify tag matches package.json
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Lint (syntax check)
        run: find src adp tests -name '*.js' | xargs node --check

      - name: Run tests
        run: find tests -name '*.test.js' | xargs node --test

      - name: Build smoke test (all examples)
        run: |
          for ex in examples/*/; do
            node src/cli.js build "$ex"
            test -s "$ex/dist/index.html"
            grep -q '<!DOCTYPE html>' "$ex/dist/index.html"
          done

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog entry for this tag
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Pull text between "## [$VERSION]" and the next "## ["
          BODY=$(awk -v v="## \\[$VERSION\\]" '
            $0 ~ v { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)
          # Write to a file (multi-line outputs are awkward)
          printf '%s\n' "$BODY" > /tmp/release_body.md
          echo "body_path=/tmp/release_body.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.body_path }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}    # vX.Y.Z-beta etc. → prerelease
