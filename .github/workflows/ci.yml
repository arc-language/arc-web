name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # Arc is a zero-dependency project — no install or audit needed.
      # If devDependencies are added later, restore `cache: 'npm'`,
      # `npm install`, and `npm audit` here.
      - name: Lint (syntax check)
        run: find src adp tests -name '*.js' | xargs node --check
      - name: Run tests
        run: find tests -name '*.test.js' | xargs node --test
      - name: Test coverage
        run: find tests -name '*.test.js' | xargs node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=70
        if: matrix.node == 22
      - name: Build smoke test (every example)
        if: matrix.node == 22
        run: |
          for ex in examples/*/; do
            rm -rf "$ex/dist"
            node src/cli.js build "$ex"
            test -s "$ex/dist/index.html"
            grep -q '<!DOCTYPE html>' "$ex/dist/index.html"
          done

      - name: Build-site smoke test (multi-page command)
        if: matrix.node == 22
        run: |
          mkdir -p /tmp/buildsite-smoke
          cat > /tmp/buildsite-smoke/a.arc <<'EOF'
          page "A" canonical="https://x.example/a"
            main
              heading "A"
              link href="b.html" "→ B"
          EOF
          cat > /tmp/buildsite-smoke/b.arc <<'EOF'
          page "B" canonical="https://x.example/b"
            main
              heading "B"
              link href="a.html" "→ A"
          EOF
          node src/cli.js build-site /tmp/buildsite-smoke
          test -s /tmp/buildsite-smoke/dist/a.html
          test -s /tmp/buildsite-smoke/dist/b.html
          grep -q '<!DOCTYPE html>' /tmp/buildsite-smoke/dist/a.html
          test -s /tmp/buildsite-smoke/dist/sitemap.xml
          test -s /tmp/buildsite-smoke/dist/_headers
          test -s /tmp/buildsite-smoke/dist/robots.txt
          ls /tmp/buildsite-smoke/dist/shared.*.css
