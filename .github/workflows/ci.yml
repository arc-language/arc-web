name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Arc is a zero-dependency project — no install or audit needed.
      # If devDependencies are added later, restore `cache: 'npm'`,
      # `npm install`, and `npm audit` here.
      - name: Lint (syntax check)
        run: find src adp -name '*.js' | xargs node --check
      - name: Run tests
        run: find tests -name '*.test.js' | xargs node --test
      - name: Test coverage
        run: find tests -name '*.test.js' | xargs node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=70
        if: matrix.node == 22
      - name: Build smoke test
        if: matrix.node == 22
        run: |
          node src/cli.js build examples/counter
          test -s examples/counter/dist/index.html
          grep -q '<!DOCTYPE html>' examples/counter/dist/index.html
