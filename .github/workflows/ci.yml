name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint (syntax check)
        run: node --check src/**/*.js adp/**/*.js
      - name: Run tests
        run: node --test tests/**/*.test.js
      - name: Test coverage
        run: node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=70 tests/**/*.test.js
        if: matrix.node == 22
      - name: Build smoke test
        run: node src/cli.js build examples/counter
        if: matrix.node == 22
